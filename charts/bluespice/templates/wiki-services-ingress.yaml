{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bluespice.fullname" . }}
  namespace: {{ default "default" $.Release.Namespace }}
  labels:
    {{- include "bluespice.labels" . | nindent 4 }}
  {{- with $.Values.ingress.ingressAnnotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
  {{- $host := required "wikiEnv.configEnv.WIKI_HOST is required for ingress" $.Values.wikiEnv.configEnv.WIKI_HOST }}
  {{- $rootServiceName := $.Values.ingress.name }}
  {{- if $.Values.frontendcache.enabled }}
  {{- $rootServiceName = $.Values.frontendcache.name }}
  {{- end }}
  - host: {{ $host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $rootServiceName }}
            port:
              name: http
      {{- if .Values.statelessbackendServices.collabpads.enabled }}
      - path: /_collabpads
        pathType: Prefix
        backend:
          service:
            name: collabpads
            port:
              name: http
      {{- end }}
      {{- if .Values.statelessbackendServices.diagram.enabled }}
      - path: /_diagram
        pathType: Prefix
        backend:
          service:
            name: diagram
            port:
              name: http
      {{- end }}
  {{- if $.Values.ingress.tls }}
  tls:
  - hosts:
    - {{ $host }}
    secretName: {{ $.Values.ingress.tlsSecret }}
  {{- end }}
---
{{- if .Values.statelessbackendServices.wire.enabled }}
{{- $wireAnnotations := dict }}
{{- if $.Values.ingress.ingressAnnotations }}
{{- $wireAnnotations = deepCopy $.Values.ingress.ingressAnnotations }}
{{- end }}
{{- if $.Values.ingress.wireAnnotations }}
{{- $wireAnnotations = merge $wireAnnotations $.Values.ingress.wireAnnotations }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bluespice.fullname" . }}-wire
  namespace: {{ default "default" $.Release.Namespace }}
  labels:
    {{- include "bluespice.labels" . | nindent 4 }}
  {{- if $wireAnnotations }}
  annotations:
  {{- toYaml $wireAnnotations | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
  - host: {{ $host }}
    http:
      paths:
      - path: /_wire
        pathType: Prefix
        backend:
          service:
            name: wire
            port:
              name: http
  {{- if $.Values.ingress.tls }}
  tls:
  - hosts:
    - {{ $host }}
    secretName: {{ $.Values.ingress.tlsSecret }}
  {{- end }}
{{- end }}
{{- end }}
