{{- range $key, $value := .Values.statelessbackendServices }}
{{- if $value.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $value.name }}
  namespace: {{ default "default" $.Release.Namespace }}
  labels:
    app: {{ $value.name }}
    {{- include "bluespice.labels" $ | nindent 4 }}
  {{- with $value.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.global.svc.type }}
  selector:
    app: {{ $value.name }}
  ports:
    - port: {{ $value.port }}
      targetPort: {{ $value.targetPort }}
      protocol: TCP
      name: http
---
{{- end }}
{{- end }}
