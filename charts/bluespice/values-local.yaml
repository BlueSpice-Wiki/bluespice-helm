# Local development and ci overrides

# Minikube's hostpath storage only supports ReadWriteOnce: run wiki-web + wiki-task
# in one pod to share the PVC.
wikiServicesCombineWebAndTask: true
wikiServicesVolume:
  wiki-pvc:
    accessModes: ["ReadWriteOnce"]

wikiEnv:
  configEnv:
    WIKI_NAME: "BlueSpice Local"
    WIKI_PORT: "8080"
    WIKI_INITIAL_ADMIN_PASS: "CHANGE_ME_ADMIN_PASSWORD"
    
statefulBackendServices:
  database:
    secrets:
      MARIADB_ROOT_PASSWORD: "CHANGE_ME_MARIADB_ROOT_PASSWORD"
      MARIADB_PASSWORD: "CHANGE_ME_MARIADB_PASSWORD"
  search:
    enabled: false
