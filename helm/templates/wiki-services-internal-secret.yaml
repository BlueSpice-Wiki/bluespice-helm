{{- $ns := default "default" .Release.Namespace }}
{{- $secretName := "internal-wiki-secrets" }}
{{- $existing := lookup "v1" "Secret" $ns $secretName | default dict }}
{{- $d := $existing.data | default dict }}
{{- /* helper: reuse existing value or generate a new random one */ -}}
{{- $wire    := index $d "INTERNAL_WIRE_API_KEY"                    | default "" }}
{{- $salt    := index $d "INTERNAL_WIKI_TOKEN_AUTH_SALT"            | default "" }}
{{- $seckey  := index $d "INTERNAL_WIKI_SECRETKEY"                  | default "" }}
{{- $upkey   := index $d "INTERNAL_WIKI_UPGRADEKEY"                 | default "" }}
{{- $samlAdm := index $d "INTERNAL_SIMPLESAMLPHP_ADMIN_PASS"        | default "" }}
{{- $samlSlt := index $d "INTERNAL_SIMPLESAMLPHP_SECRET_SALT"       | default "" }}
{{- $samlTok := index $d "INTERNAL_SIMPLESAMLPHP_SESSION_API_TOKEN" | default "" }}
{{- $chatTok := index $d "INTERNAL_CHAT_TOKEN"                      | default "" }}
{{- $chatAcc := index $d "INTERNAL_CHAT_WIKI_ACCESS_TOKEN"          | default "" }}
{{- $aiKey   := index $d "CHAT_AI_CHAT_SERVICE_API_KEY"             | default "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "bluespice.labels" . | nindent 4 }}
type: Opaque
stringData:
  INTERNAL_WIRE_API_KEY:                    {{ ternary ($wire    | b64dec) (randAlphaNum 64) (ne $wire    "") | quote }}
  INTERNAL_WIKI_TOKEN_AUTH_SALT:            {{ ternary ($salt    | b64dec) (randAlphaNum 64) (ne $salt    "") | quote }}
  INTERNAL_WIKI_SECRETKEY:                  {{ ternary ($seckey  | b64dec) (randAlphaNum 64) (ne $seckey  "") | quote }}
  INTERNAL_WIKI_UPGRADEKEY:                 {{ ternary ($upkey   | b64dec) (randAlphaNum 16) (ne $upkey   "") | quote }}
  INTERNAL_SIMPLESAMLPHP_ADMIN_PASS:        {{ ternary ($samlAdm | b64dec) (randAlphaNum 16) (ne $samlAdm "") | quote }}
  INTERNAL_SIMPLESAMLPHP_SECRET_SALT:       {{ ternary ($samlSlt | b64dec) (randAlphaNum 64) (ne $samlSlt "") | quote }}
  INTERNAL_SIMPLESAMLPHP_SESSION_API_TOKEN: {{ ternary ($samlTok | b64dec) (randAlphaNum 64) (ne $samlTok "") | quote }}
  INTERNAL_CHAT_TOKEN:                      {{ ternary ($chatTok | b64dec) (randAlphaNum 64) (ne $chatTok "") | quote }}
  INTERNAL_CHAT_WIKI_ACCESS_TOKEN:          {{ ternary ($chatAcc | b64dec) (randAlphaNum 64) (ne $chatAcc "") | quote }}
  CHAT_AI_CHAT_SERVICE_API_KEY:             {{ ternary ($aiKey   | b64dec) (randAlphaNum 64) (ne $aiKey   "") | quote }}
