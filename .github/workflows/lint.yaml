name: lint

on:
  push:
    branches: [5.2.x]
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yaml'
  pull_request:
    branches: [5.2.x]
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yaml'

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: helm lint
        run: helm lint ./charts/bluespice --strict
