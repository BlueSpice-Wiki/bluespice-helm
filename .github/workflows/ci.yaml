name: ci

on:
  push:
    branches: [5.2.x]
    paths:
      - 'charts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [5.2.x]
    paths:
      - 'charts/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: helm lint
        run: helm lint ./charts/bluespice --strict

  deploy-and-test:
    needs: helm-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          cpus: 2
          memory: 4096m

      - name: Create internal secrets
        run: |
          kubectl create namespace bluespice
          kubectl -n bluespice create secret generic internal-wiki-secrets \
            --from-literal=CHAT_AI_CHAT_SERVICE_API_KEY="$(openssl rand -hex 32)" \
            --from-literal=INTERNAL_CHAT_TOKEN="$(openssl rand -hex 32)" \
            --from-literal=INTERNAL_CHAT_WIKI_ACCESS_TOKEN="$(openssl rand -hex 32)" \
            --from-literal=INTERNAL_SIMPLESAMLPHP_ADMIN_PASS="$(openssl rand -hex 16)" \
            --from-literal=INTERNAL_SIMPLESAMLPHP_SECRET_SALT="$(openssl rand -hex 32)" \
            --from-literal=INTERNAL_WIKI_UPGRADEKEY="$(openssl rand -hex 16)" \
            --from-literal=INTERNAL_WIKI_SECRETKEY="$(openssl rand -hex 32)" \
            --from-literal=INTERNAL_WIKI_TOKEN_AUTH_SALT="$(openssl rand -hex 32)" \
            --from-literal=INTERNAL_WIRE_API_KEY="$(openssl rand -hex 32)"

      - name: Install chart
        run: |
          ADMIN_PASS="$(openssl rand -hex 16)"
          DB_PASS="$(openssl rand -hex 16)"
          ROOT_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$ADMIN_PASS"
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$ROOT_PASS"

          helm install bluespice ./charts/bluespice \
            --namespace bluespice \
            --values ./charts/bluespice/values-local.yaml \
            --set ingress.enabled=false \
            --set-string wikiEnv.configEnv.WIKI_INITIAL_ADMIN_PASS="$ADMIN_PASS" \
            --set-string statefulBackendServices.database.secrets.MARIADB_PASSWORD="$DB_PASS" \
            --set-string statefulBackendServices.database.secrets.MARIADB_ROOT_PASSWORD="$ROOT_PASS"

      - name: Wait for BlueSpice and verify it serves a wiki page
        run: |
          set -euo pipefail

          kubectl -n bluespice wait --for=condition=Available deployment --all --timeout=600s

          # Call the Service from inside the cluster
          kubectl -n bluespice run wiki-http-check \
            --image=curlimages/curl:8.11.1 \
            --restart=Never --attach --rm \
            --command -- /bin/sh -c '
              for i in $(seq 1 120); do
                if curl -fsSL -o /tmp/wiki.html http://wiki-web/ \
                   && grep -qi bluespice /tmp/wiki.html; then
                  echo "BlueSpice served a wiki page over HTTP."
                  exit 0
                fi
                echo "Attempt ${i}/120: wiki not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Wiki did not serve a BlueSpice page in time." >&2
              exit 1
            '

      - name: Debug failure
        if: failure()
        run: |
          kubectl -n bluespice get pods,svc
          kubectl -n bluespice describe pods
          kubectl -n bluespice logs -l app=wiki-web --all-containers --tail=200 || true
